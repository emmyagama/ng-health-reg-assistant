<svg baseProfile="full" height="901px" version="1.1" viewBox="0 0 980 901" width="980px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="12" markerWidth="10" orient="auto" refX="10" refY="6.0"><polygon fill="#222222" points="0,0 10,6.0 0,12" /></marker></defs><text fill="#0D1F33" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="490.0" y="70">Nigerian Health-Regulation RAG — Pipeline Architecture</text><rect fill="#E8F0FE" height="58.5" rx="10" ry="10" stroke="#1F3A5F" stroke-width="1.5" width="540" x="60" y="100" /><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="127.0">Public documents (NDPA, NDPC, NHIA, HEFAMAA, MLSCN, National</text><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="146.5">Health Act, ISO 15189, WHO)</text><rect fill="#E8F0FE" height="39.0" rx="10" ry="10" stroke="#1F3A5F" stroke-width="1.5" width="540" x="60" y="204.5" /><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="231.5">download_corpus.py → data/raw/ (PDFs, never committed to git)</text><rect fill="#E8F0FE" height="58.5" rx="10" ry="10" stroke="#1F3A5F" stroke-width="1.5" width="540" x="60" y="289.5" /><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="316.5">chunker.py → section-aware chunks with overlap →</text><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="336.0">all_chunks.json</text><rect fill="#E8F0FE" height="58.5" rx="10" ry="10" stroke="#1F3A5F" stroke-width="1.5" width="540" x="60" y="394.0" /><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="421.0">embed_store.py → all-MiniLM-L6-v2 embeddings → ChromaDB</text><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="440.5">(persistent vector store)</text><rect fill="#E8F0FE" height="58.5" rx="10" ry="10" stroke="#1F3A5F" stroke-width="1.5" width="540" x="60" y="498.5" /><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="525.5">User question → query_store() → top-5 relevant chunks</text><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="545.0">(retrieval)</text><rect fill="#E8F0FE" height="58.5" rx="10" ry="10" stroke="#1F3A5F" stroke-width="1.5" width="540" x="60" y="603.0" /><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="630.0">answer.py → Groq LLM (openai/gpt-oss-120b) → answer with</text><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="649.5">citations</text><rect fill="#E8F0FE" height="58.5" rx="10" ry="10" stroke="#1F3A5F" stroke-width="1.5" width="540" x="60" y="707.5" /><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="734.5">guardrails.py → 4 checks: retrieval confidence, citation</text><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="754.0">required, clinical refusal, out-of-corpus refusal</text><rect fill="#E8F0FE" height="39.0" rx="10" ry="10" stroke="#1F3A5F" stroke-width="1.5" width="540" x="60" y="812.0" /><text fill="#111111" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="78" y="839.0">Streamlit UI → shows answer + sources, OR a refusal message</text><line marker-end="url(#arrowhead)" stroke="#222222" stroke-width="1.8" x1="330.0" x2="330.0" y1="158.5" y2="202.5" /><line marker-end="url(#arrowhead)" stroke="#222222" stroke-width="1.8" x1="330.0" x2="330.0" y1="243.5" y2="287.5" /><line marker-end="url(#arrowhead)" stroke="#222222" stroke-width="1.8" x1="330.0" x2="330.0" y1="348.0" y2="392.0" /><line marker-end="url(#arrowhead)" stroke="#222222" stroke-width="1.8" x1="330.0" x2="330.0" y1="452.5" y2="496.5" /><line marker-end="url(#arrowhead)" stroke="#222222" stroke-width="1.8" x1="330.0" x2="330.0" y1="557.0" y2="601.0" /><line marker-end="url(#arrowhead)" stroke="#222222" stroke-width="1.8" x1="330.0" x2="330.0" y1="661.5" y2="705.5" /><line marker-end="url(#arrowhead)" stroke="#222222" stroke-width="1.8" x1="330.0" x2="330.0" y1="766.0" y2="810.0" /><rect fill="#FFF4D6" height="43.6" rx="10" ry="10" stroke="#B88B3A" stroke-width="1.0" width="280" x="636" y="401.45" /><text fill="#4A3A1A" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="648" y="421.45">Rejected: FAISS (Chroma chosen for</text><text fill="#4A3A1A" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="648" y="437.05">simpler built-in persistence)</text><line stroke="#B88B3A" stroke-dasharray="4,3" stroke-width="1.2" x1="600" x2="636" y1="423.25" y2="423.25" /><rect fill="#FFF4D6" height="43.6" rx="10" ry="10" stroke="#B88B3A" stroke-width="1.0" width="280" x="636" y="575.85" /><text fill="#4A3A1A" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="648" y="595.85">Rejected: fine-tuning, agents, voice</text><text fill="#4A3A1A" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="648" y="611.45">(explicitly out of scope)</text><line stroke="#B88B3A" stroke-dasharray="4,3" stroke-width="1.2" x1="600" x2="636" y1="597.65" y2="597.65" /><rect fill="#FFF4D6" height="59.2" rx="10" ry="10" stroke="#B88B3A" stroke-width="1.0" width="280" x="636" y="629.45" /><text fill="#4A3A1A" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="648" y="649.45">Rejected: Ollama local fallback (Groq</text><text fill="#4A3A1A" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="648" y="665.0500000000001">free tier sufficient; adds unused</text><text fill="#4A3A1A" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="648" y="680.6500000000001">setup weight)</text><line stroke="#B88B3A" stroke-dasharray="4,3" stroke-width="1.2" x1="600" x2="636" y1="659.0500000000001" y2="659.0500000000001" /></svg>